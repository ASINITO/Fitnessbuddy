{% extends "base.html" %}

{% block title %}User Profile - FitBuddy{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div class="border-b border-slate-800 pb-4">
    <h1 class="text-3xl font-extrabold text-white">Your Fitness Profile</h1>
    <p class="text-xs sm:text-sm text-slate-400 mt-1">Updates immediately calibrate future Gemini workout and nutrition recommendations.</p>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl space-y-6">
    <form id="profile_form" onsubmit="handleProfileUpdate(event)" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name</label>
          <input type="text" id="p_name" value="xyz" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Age</label>
          <input type="number" id="p_age" value="20" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Height (cm)</label>
          <input type="number" id="p_height" value="175" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Weight (kg)</label>
          <input type="number" step="0.1" id="p_weight" value="70.0" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Fitness Level</label>
          <select id="p_level" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate" selected>Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Intensity</label>
          <select id="p_intensity" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High" selected>High</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Fitness Goal</label>
          <input type="text" id="p_goal" value="i want to lose belly fat and gain muscles" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
      </div>

      <button type="submit" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs rounded-xl transition-all">
        Save Profile Updates
      </button>
    </form>
  </div>
</div>

<script>
function handleProfileUpdate(e) {
  e.preventDefault();
  const payload = {
    name: document.getElementById('p_name').value,
    age: parseInt(document.getElementById('p_age').value),
    height: parseFloat(document.getElementById('p_height').value),
    weight: parseFloat(document.getElementById('p_weight').value),
    fitness_level: document.getElementById('p_level').value,
    intensity: document.getElementById('p_intensity').value,
    goal: document.getElementById('p_goal').value
  };

  fetch('/api/profile', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(() => {
    alert('Profile updated successfully!');
  });
}
</script>
{% endblock %}
