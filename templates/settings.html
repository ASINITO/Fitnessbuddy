{% extends "base.html" %}

{% block title %}Settings - FitBuddy{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <div class="border-b border-slate-800 pb-4">
    <h1 class="text-3xl font-extrabold text-white">Application Settings</h1>
    <p class="text-xs sm:text-sm text-slate-400 mt-1">Configure language, notifications, and security preferences.</p>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Preferred Language</label>
        <select class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          <option value="en" selected>English (Default)</option>
          <option value="ta">தமிழ் (Tamil)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Gemini AI Model Priority</label>
        <select class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono">
          <option value="gemini-3.8-flash" selected>gemini-3.8-flash (Fast & Responsive)</option>
          <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (Advanced Reasoning)</option>
        </select>
      </div>

      <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
        <div>
          <h4 class="text-sm font-semibold text-white">Daily Workout Reminders</h4>
          <p class="text-xs text-slate-400">Receive in-app alerts at 07:00 AM</p>
        </div>
        <input type="checkbox" checked class="w-5 h-5 accent-emerald-500 rounded">
      </div>
    </div>
  </div>
</div>
{% endblock %}
