{% extends "base.html" %}

{% block title %}Sign In - FitBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl space-y-6">
  <div class="text-center space-y-2">
    <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black text-2xl mx-auto">⚡</div>
    <h1 class="text-2xl font-black text-white">Sign In to FitBuddy</h1>
    <p class="text-xs text-slate-400">Access your personalized fitness profile and plans</p>
  </div>

  <form id="login_form" onsubmit="handleLogin(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Username or Email</label>
      <input type="text" id="log_username" required value="fitness_pro"
        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-emerald-500">
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password</label>
      <input type="password" id="log_password" required value="password123"
        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-emerald-500">
    </div>

    <button type="submit"
      class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm rounded-xl transition-all shadow-lg shadow-emerald-500/20">
      Sign In
    </button>
  </form>

  <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
    Don't have an account? <a href="/register" class="text-emerald-400 font-semibold hover:underline">Register here</a>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('log_username').value;
  const p = document.getElementById('log_password').value;

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username_or_email: u, password: p })
  })
  .then(r => r.json())
  .then(d => {
    if (d.message) {
      window.location.href = '/dashboard';
    } else {
      alert(d.detail || 'Login failed');
    }
  })
  .catch(() => {
    window.location.href = '/dashboard';
  });
}
</script>
{% endblock %}
